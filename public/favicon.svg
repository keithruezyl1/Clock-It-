<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bda0fb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="144" fill="url(#bg)"/>
  <g transform="translate(76 46) scale(3)">
    <!-- legs -->
    <rect x="42" y="106" width="9" height="16" rx="4.5" fill="#4c1d95" transform="rotate(14 46 114)"/>
    <rect x="69" y="106" width="9" height="16" rx="4.5" fill="#4c1d95" transform="rotate(-14 74 114)"/>
    <!-- alarm bells -->
    <circle cx="30" cy="20" r="9" fill="#4c1d95"/>
    <circle cx="90" cy="20" r="9" fill="#4c1d95"/>
    <rect x="56" y="6" width="8" height="10" rx="4" fill="#4c1d95"/>
    <!-- body + face -->
    <circle cx="60" cy="64" r="48" fill="#5b21b6"/>
    <circle cx="60" cy="64" r="38" fill="#ffffff"/>
    <!-- ticks -->
    <circle cx="60" cy="32" r="2.6" fill="#d6c2ff"/>
    <circle cx="92" cy="64" r="2.6" fill="#d6c2ff"/>
    <circle cx="60" cy="96" r="2.6" fill="#d6c2ff"/>
    <circle cx="28" cy="64" r="2.6" fill="#d6c2ff"/>
    <!-- eyes -->
    <circle cx="46.5" cy="57" r="3.6" fill="#5b21b6"/>
    <circle cx="73.5" cy="57" r="3.6" fill="#5b21b6"/>
    <!-- blush -->
    <ellipse cx="40" cy="68" rx="4.2" ry="2.6" fill="#ffc4ad" opacity="0.85"/>
    <ellipse cx="80" cy="68" rx="4.2" ry="2.6" fill="#ffc4ad" opacity="0.85"/>
    <!-- smile -->
    <path d="M51 66 q 9 8 18 0" fill="none" stroke="#5b21b6" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
