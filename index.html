<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#a78bfa" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem('clockit_theme_v1') || '{}')
          var themes = { lavender: 1, mint: 1, peach: 1, sky: 1, slate: 1 }
          var t = themes[s.theme] ? s.theme : 'lavender'
          var m = s.mode === 'dark' || s.mode === 'light' ? s.mode : s.mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : 'light'
          var d = document.documentElement
          d.dataset.theme = t
          d.dataset.mode = m
          d.style.colorScheme = m
          var meta = {
            lavender: ['#a78bfa', '#262138'],
            mint: ['#34d399', '#1d2a24'],
            peach: ['#fb8c66', '#312520'],
            sky: ['#5aa6ff', '#1c2534'],
            slate: ['#64748b', '#21252d'],
          }
          var el = document.querySelector('meta[name="theme-color"]')
          if (el) el.setAttribute('content', meta[t][m === 'dark' ? 1 : 0])
        } catch (e) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clock It!" />
    <meta name="description" content="Track your OJT time with GPS-verified clock in and clock out." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Clock It!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
